name: tip_calculator
description: A simple tip calculator with quick tip and total rounding.
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  google_fonts: ^9.0.0
  provider: ^6.1.5+1
  money2: ^6.3.1
  sentry_flutter: ^10.3.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: 'assets/icon.png'
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: '#0B0B0B'
  adaptive_icon_foreground: 'assets/icon-no-background.png'

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
